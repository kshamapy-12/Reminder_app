<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="node_modules/lucide/dist/umd/lucide.js"></script>

    <link rel="stylesheet" href="style.css" />
    <style type="text/tailwindcss"></style>
  </head>
  <body>

    <div class="p-5 flex flex-col bg-slate-100 justify-center items-center min-h-screen overflow-auto">
      <!--Form starts-->
      <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center main">
          <div class="w-100 bg-white p-6 rounded-3xl shadow-lg">
            <h1 class="text-lg font-semibold text-center">New Call</h1>
            <form class="mt-3">
            <h3 class="mb-2 text-sm">Image URL</h3>
              <input required type="text" placeholder="https://images.unsplash.com/photo-" id="imgUrl" class="px-3 py-2 w-full rounded-2xl outline-none text-sm border border-gray-500 mb-4">
              <h3 class="mb-2 text-sm">Full Name</h3>
              <input required type="text" placeholder="Enter Full Name" id="fullName" class="px-3 py-2 w-full rounded-2xl outline-none text-sm border border-gray-500 mb-4">
              <h3 class="mb-2 text-sm">Home Town</h3>
              <input required type="text" placeholder="Enter your Home Town" id="homeTown" class="px-3 py-2 w-full rounded-2xl outline-none text-sm border border-gray-500 mb-4">
              <h3 class="mb-2 text-sm">Purpose</h3>
              <input required type="text" placeholder="e.g: Quick appointment note" id="quickNote" class="px-3 py-2 w-full rounded-2xl outline-none text-sm border border-gray-500 mb-4">
              <h3 class="mb-2 text-sm">Category</h3>
              <div class="flex flex-row flex-wrap gap-5">
              <div class="border border-red-500 px-3 py-2 rounded-full active:scale-95">
                <input required type="radio" name="Category" value="Emergency" id="emergency">
              <label for="emergency" class="text-sm gap-2 text-red-500">Emergency</label>
              </div>
              <div class="border border-green-500 px-3 py-2 rounded-full active:scale-95">
                <input required type="radio" name="Category" value="Important" id="important">
              <label for="important" class="text-sm gap-2 text-green-500">Important</label>
              </div>
              <div class="border border-indigo-500 px-3 py-2 rounded-full active:scale-95">
                <input required type="radio" name="Category" value="Urgent" id="urgent">
              <label for="urgent" class="text-sm gap-2 text-indigo-500">Urgent</label>
              </div>
              <div class="border border-purple-500 px-3 py-2 rounded-full active:scale-95">
                <input required type="radio" name="Category" value="No Rush" id="no-rush">
              <label for="no-rush" class="text-sm gap-2 text-purple-500">No Rush</label>
              </div>
              </div>

              <button class="w-full bg-black text-white text-sm px-3 py-3 rounded-full mt-5 active:scale-95">Create Note</button>
              <button class="w-full bg-red-400 text-white text-sm px-3 py-3 rounded-full mt-5 active:scale-95" id="closeForm">Close</button>
            </form>

          </div>
      </div>

<!--Form Ends-->

 <div class="card flex items-center justify-center gap-5">
  <!--Left buttons-->
      <div class="flex flex-col gap-3">
        <button class="rounded-full bg-white shadow-lg px-4 py-3.5 active:scale-95" id="add-note"><i data-lucide="plus"></i></button>
        <button class="rounded-full bg-white shadow-lg px-4 py-3.5 active:scale-95" id="upBtn"><i data-lucide="arrow-up"></i></button>
        <button class="rounded-full bg-white shadow-lg px-4 py-3.5 active:scale-95" id="downBtn"><i data-lucide="arrow-down"></i></button>
      </div>

      
<!--cards-->
      <div id="stack" class="grid grid-cols-1 grid-rows-1 place-items-center">
        

      </div>
      <!--Cards end-->

    
<!--Priority buttons-->
      <div class="flex flex-col gap-3">
        <button class="rounded-full p-3 bg-red-500 active:scale-90 shadow-lg border border-slate-400" id="emerBtn"></button>
        <button class="rounded-full p-3 bg-green-500 active:scale-90 shadow-lg border border-slate-400" id="impBtn"></button>
        <button class="rounded-full p-3 bg-indigo-500 active:scale-90 shadow-lg border border-slate-400" id="urgBtn"></button>
        <button class="rounded-full p-3 bg-purple-500 active:scale-90 shadow-lg border border-slate-400" id="noRushBtn"></button>
      </div>
    </div>
    </div>
</div>

  
    



   
    
    <script src="script.js"></script>

  </body>
</html>
